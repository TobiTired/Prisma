name: Build stable Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      create_release_tag:
        description: "After all verification passes, create the version tag and start the stable release run"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run privacy:audit
      - run: npm test
      - run: npm run build
      - name: Build Windows release artifacts
        run: npx electron-builder --win nsis portable --publish never --config.directories.output=release
      - name: Verify updater artifacts
        run: ./tools/verify-release.ps1
      - name: Test Windows install, associations, launch, and uninstall
        run: ./tools/windows-smoke.ps1
      - name: Create verified release tag
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release_tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content "package.json" -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $existing = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>$null
          if (-not $existing) {
            gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$env:GITHUB_SHA"
          } elseif ($existing -ne $env:GITHUB_SHA) {
            Write-Host "$tag already exists at the previously verified commit $existing; preserving it."
          }
          Write-Host "$tag is ready for release publication."
      - name: Create draft release and attach verified artifacts
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release_tag) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content "package.json" -Raw | ConvertFrom-Json).version
          $tag = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF_NAME } else { "v$version" }
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --verify-tag --title "Prisma $tag" --generate-notes
          }
          gh release upload $tag release/*.exe release/latest.yml release/*.blockmap --clobber
      - name: Verify published asset set before making release public
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release_tag) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content "package.json" -Raw | ConvertFrom-Json).version
          $tag = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF_NAME } else { "v$version" }
          $names = gh release view $tag --json assets --jq '.assets[].name'
          $required = @("latest.yml", "Prisma-$version-x64-Setup.exe", "Prisma-$version-x64-Portable.exe", "Prisma-$version-x64-Setup.exe.blockmap")
          foreach ($name in $required) {
            if ($names -notcontains $name) { throw "Draft release is missing $name" }
          }
          gh release edit $tag --draft=false --latest
      - name: Verify latest updater metadata is publicly accessible
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release_tag) }}
        run: |
          $version = (Get-Content "package.json" -Raw | ConvertFrom-Json).version
          $url = "https://github.com/TobiTired/Prisma/releases/latest/download/latest.yml"
          $verified = $false
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            $response = Invoke-WebRequest "$url`?verify=$([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())" -UseBasicParsing
            $content = if ($response.Content -is [byte[]]) {
              [Text.Encoding]::UTF8.GetString($response.Content)
            } else {
              [string]$response.Content
            }
            if ($response.StatusCode -eq 200 -and $content -match "version:\s*$([regex]::Escape($version))") {
              $verified = $true
              break
            }
            Write-Host "latest.yml has not propagated to version $version yet (attempt $attempt of 12)."
            Start-Sleep -Seconds 10
          }
          if (-not $verified) {
            throw "Public latest.yml did not identify version $version after the propagation window."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Prisma-Windows-${{ github.ref_name }}
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
