name: Build stable Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run privacy:audit
      - run: npm test
      - run: npm run build
      - name: Build installer for verification
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: npx electron-builder --win nsis portable --publish never --config.directories.output=release
      - name: Build and publish tagged stable release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis portable --publish always --config.directories.output=release
      - uses: actions/upload-artifact@v4
        with:
          name: Prisma-Windows-${{ github.ref_name }}
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
